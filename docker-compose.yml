services:
  hermes:
    build: .
    container_name: hermes-${INSTANCE_NAME}
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:8642"
      - "127.0.0.1:${DASHBOARD_PORT}:9119"
    volumes:
      # Un seul montage suffit pour la config et les données
      - ${HERMES_DIR}:/opt/data
      - hermes-agent-src:/opt/hermes
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HF_TOKEN=${HF_TOKEN:-}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
    env_file:
      # Le fichier .env d'environnement pour l'agent est lu au même endroit
      - ${HERMES_DIR}/.env
    shm_size: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui-${INSTANCE_NAME}
    depends_on:
      - hermes
    ports:
      - "0.0.0.0:${WEBUI_PORT}:8787"
    volumes:
      - ${HERMES_DIR}:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - ${WORKSPACE_DIR}:/workspace
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - WANTED_UID=1000
      - WANTED_GID=1000
      - HERMES_SKIP_CHMOD=1
      - HERMES_API_URL=http://hermes-${INSTANCE_NAME}:8642
      - HERMES_WEBUI_CHAT_BACKEND=gateway
      - HERMES_WEBUI_GATEWAY_BASE_URL=http://hermes-${INSTANCE_NAME}:8642
      - HERMES_WEBUI_GATEWAY_USE_RUNS_API=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hermes-agent-src:
    name: hermes-agent-src-${INSTANCE_NAME}
